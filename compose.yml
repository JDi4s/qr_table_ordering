name: mesa-test
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://mesa:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/mesa
      REDIS_URL: redis://redis:6379/1
      RAILS_SERVE_STATIC_FILES: 'true'
      WEB_CONCURRENCY: '1'
    ports:
      - '127.0.0.1:3100:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/rails/storage
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mesa
      POSTGRES_DB: mesa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mesa -d mesa']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  db_data:
  app_storage:
